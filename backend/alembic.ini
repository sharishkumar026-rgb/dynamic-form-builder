[alembic]
script_location = alembic
prepend_sys_path = .

# Database URL is loaded from app/core/config.py
# through alembic/env.py
sqlalchemy.url = mysql+pymysql://root:password@localhost:3306/dynamic_form_builder


[loggers]
keys = root,sqlalchemy,alembic


[handlers]
keys = console


[formatters]
keys = generic


[logger_root]
level = WARN
handlers = console


[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine


[logger_alembic]
level = INFO
handlers =
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s